<style>
  :root {
    --bg: #1C1D21;
    --surface: #26272D;
    --surface-alt: #15161A;
    --border: #34353C;
    --border-top: #42434B;
    --text: #EDEDEF;
    --muted: #9A9AA3;
    --tertiary: #6B6B72;
    --accent: #7DD3FC;
    --accent-soft: #1E3A4A;
    --accent-soft-border: #2C5468;
  }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    letter-spacing: -0.011em;
    font-weight: 400;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .ease-spatial { transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }

  /* Reveal on enter */
  .reveal { opacity: 0; transform: translateY(10px); transition: opacity 900ms cubic-bezier(0.16,1,0.3,1), transform 900ms cubic-bezier(0.16,1,0.3,1); }
  .reveal.in { opacity: 1; transform: translateY(0); }

  /* Hero headline */
  .hero-h1 {
    font-size: clamp(48px, 8vw, 120px);
    line-height: 0.95;
    letter-spacing: -0.04em;
    font-weight: 700;
  }

  /* Marquee */
  @keyframes marquee {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .marquee-track { animation: marquee 60s linear infinite; }
  .marquee:hover .marquee-track { animation-play-state: paused; }

  /* Scroll chevron */
  @keyframes nudge {
    0%, 100% { transform: translateY(0); opacity: 0.55; }
    50% { transform: translateY(6px); opacity: 1; }
  }
  .nudge { animation: nudge 2.4s cubic-bezier(0.16,1,0.3,1) infinite; }

  /* Selection */
  ::selection { background: rgba(125,211,252,0.25); color: #EDEDEF; }

  /* Subtle scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #15161A; }
  ::-webkit-scrollbar-thumb { background: #34353C; border-radius: 8px; }

  /* Scroll progress bar */
  .scroll-progress {
    position: fixed; top: 0; left: 0; height: 2px; width: 0%;
    background: var(--accent);
    z-index: 60; pointer-events: none;
    transition: width 80ms linear;
  }

  /* Card depth trick — lighter top edge simulates light from above */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top-color: var(--border-top);
    transition: border-color 200ms ease-out, transform 200ms ease-out;
  }
  .card:hover {
    border-top-color: rgba(125,211,252,0.6) !important;
    transform: translateY(-3px);
  }

  /* Project media art — deeper recessed surface with cyan linework */
  .art {
    position: absolute; inset: 0;
    background: #101115;
    overflow: hidden;
  }
  .art::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(16,17,21,0) 60%, rgba(16,17,21,0.7) 100%);
  }

  /* Art 1 — wave grid */
  .art-1 {
    background:
      radial-gradient(120% 80% at 80% 20%, rgba(125,211,252,0.20), transparent 60%),
      radial-gradient(80% 60% at 20% 90%, rgba(125,211,252,0.10), transparent 65%),
      #101115;
  }
  .art-1::before {
    content: ""; position: absolute; inset: -20%;
    background-image:
      linear-gradient(to right, rgba(125,211,252,0.16) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(125,211,252,0.16) 1px, transparent 1px);
    background-size: 28px 28px;
    transform: perspective(700px) rotateX(55deg) translateY(8%);
    transform-origin: center;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, #000 30%, transparent 80%);
  }

  /* Art 2 — concentric rings */
  .art-2 {
    background:
      repeating-radial-gradient(circle at 50% 60%, rgba(125,211,252,0.22) 0px, rgba(125,211,252,0.22) 1px, transparent 1px, transparent 14px),
      radial-gradient(60% 50% at 50% 60%, rgba(125,211,252,0.14), transparent 70%),
      #101115;
  }
  @keyframes pulse2 { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
  .art-2::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 60%, rgba(125,211,252,0.6) 0%, transparent 6%);
    animation: pulse2 3.6s ease-in-out infinite;
  }

  /* Art 3 — ballistic trajectories */
  .art-3 {
    background:
      linear-gradient(180deg, #101115 0%, #15161A 100%);
  }
  .art-3::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(237,237,239,0.08) 1px, transparent 1px);
    background-size: 14px 100%;
    mask-image: linear-gradient(180deg, transparent, #000 60%);
  }

  /* Art 4 — voxel cloud */
  .art-4 {
    background:
      radial-gradient(closest-side at 30% 40%, rgba(125,211,252,0.20), transparent 60%),
      radial-gradient(closest-side at 70% 70%, rgba(237,237,239,0.06), transparent 60%),
      #101115;
  }
  .art-4::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(rgba(125,211,252,0.6) 1px, transparent 1.5px),
      radial-gradient(rgba(237,237,239,0.25) 1px, transparent 1.5px);
    background-size: 18px 18px, 26px 26px;
    background-position: 0 0, 9px 13px;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 80%);
  }

  /* Art 5 — product configurator orbit */
  .art-5 {
    background:
      radial-gradient(60% 60% at 50% 50%, rgba(125,211,252,0.16), transparent 70%),
      #101115;
  }
  .art-5::before {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 70%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid rgba(125,211,252,0.40);
  }
  .art-5::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 40%; aspect-ratio: 1;
    transform: translate(-50%, -50%) rotate(20deg);
    border-radius: 50%;
    border: 1px dashed rgba(237,237,239,0.18);
  }

  /* Art 6 — webrtc waveform */
  .art-6 {
    background: #101115;
    overflow: hidden;
  }
  .art-6::before {
    content: ""; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(90deg, rgba(125,211,252,0) 0px, rgba(125,211,252,0) 5px, rgba(125,211,252,0.22) 5px, rgba(125,211,252,0.22) 6px);
    mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, #000 30%, transparent 85%);
  }

  /* Hairline */
  .hairline { border-color: var(--border); }

  /* CTA */
  .btn-primary {
    background: var(--accent); color: #0A0A0B;
    transition: transform 500ms cubic-bezier(0.16,1,0.3,1), background 400ms;
  }
  .btn-primary:hover { background: #A8E2FD; }
  .btn-ghost {
    border: 1px solid var(--accent); color: var(--accent); background: transparent;
    transition: background 500ms cubic-bezier(0.16,1,0.3,1);
  }
  .btn-ghost:hover { background: rgba(125,211,252,0.08); }

  /* Section spec label dot */
  .spec-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display:inline-block; margin-right: 10px; vertical-align: middle; }

  /* Hero canvas pos */
  .hero-canvas { position: absolute; inset: 0; z-index: 0; }

  /* Hero atmospheric glow — soft cyan radial behind the cloud */
  .hero-glow {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(40% 50% at 50% 45%, rgba(125,211,252,0.12) 0%, transparent 70%);
  }

  /* Vignette — fade to base bg so overlay text reads */
  .hero-vignette {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(120% 80% at 70% 50%, rgba(28,29,33,0) 30%, rgba(28,29,33,0.45) 80%),
      linear-gradient(180deg, rgba(28,29,33,0.0) 50%, rgba(28,29,33,0.85) 100%);
  }

  /* Tech chips — luminescent labels */
  .chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--accent-soft-border);
    padding: 3px 9px;
    border-radius: 4px;
    letter-spacing: 0.02em;
  }

  /* Category tags */
  .cat-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    color: var(--text);
    letter-spacing: 0.04em;
  }

  /* Timeline — small precious glow allowed on nodes */
  .tl-node {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    box-shadow: 0 0 12px rgba(125,211,252,0.4);
  }

  /* Link underline accent */
  .link-acc { position: relative; }
  .link-acc::after {
    content: ""; position: absolute; left: 0; bottom: -2px; height: 1px;
    background: var(--accent); width: 0;
    transition: width 600ms cubic-bezier(0.16,1,0.3,1);
  }
  .link-acc:hover::after { width: 100%; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface); border: 1px solid var(--border); border-top-color: var(--border-top); padding: 10px 16px; border-radius: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    opacity: 0; transition: opacity 400ms, transform 600ms cubic-bezier(0.16,1,0.3,1);
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Top status bar */
  .topnav-blur { backdrop-filter: blur(14px); background: rgba(28,29,33,0.7); }
</style>

<script type="text/babel" data-presets="env,react">
const { useEffect, useRef, useState, useCallback } = React;

/* ============================================================
   Lucide-style inline icons (no external dep, same visual lang)
   ============================================================ */
const Icon = ({ d, size = 18, stroke = 1.6, children, className = "" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" className={className}>

);
const I = {

  ChevronDown:(p) => <Icon {...p}><path d="m6 9 6 6 6-6"/></Icon>,
  ExternalLink:(p) => <Icon {...p}><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></Icon>,
  Github:     (p) => <Icon {...p}><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5a13 13 0 0 0-7 0C7 2 6 2 6 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 5 9c0 3.5 3 5.5 6 5.5a4.7 4.7 0 0 0-1 3.5v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></Icon>,
  Linkedin:   (p) => <Icon {...p}><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></Icon>,
  Mail:       (p) => <Icon {...p}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></Icon>,
  Copy:       (p) => <Icon {...p}><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></Icon>,
  Check:      (p) => <Icon {...p}><path d="M20 6 9 17l-5-5"/></Icon>,
  Network:    (p) => <Icon {...p}><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></Icon>,
  Activity:   (p) => <Icon {...p}><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.5.5 0 0 1-.96 0L9.24 2.18a.5.5 0 0 0-.96 0l-2.35 8.36A2 2 0 0 1 4 12H2"/></Icon>,
  Crosshair:  (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><line x1="22" x2="18" y1="12" y2="12"/><line x1="6" x2="2" y1="12" y2="12"/><line x1="12" x2="12" y1="6" y2="2"/><line x1="12" x2="12" y1="22" y2="18"/></Icon>,
  Box:        (p) => <Icon {...p}><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></Icon>,
  Mic:        (p) => <Icon {...p}><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></Icon>,
  Users:      (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>,
  MapPin:     (p) => <Icon {...p}><path d="M20 10c0 7-8 13-8 13s-8-6-8-13a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></Icon>,
  FileText:   (p) => <Icon {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></Icon>,
};

/* ============================================================
   Reveal-on-scroll wrapper
   ============================================================ */
const Reveal = ({ children, delay = 0, as: Tag = "div", className = "", ...rest }) => {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          setTimeout(() => el.classList.add("in"), delay);
          io.unobserve(el);
        }
      });
    }, { threshold: 0.12 });
    io.observe(el);
    return () => io.disconnect();
  }, [delay]);
  return <Tag ref={ref} className={`reveal ${className}`} {...rest}>{children}</Tag>;
};

/* ============================================================
   HERO — Three.js point cloud
   ============================================================ */
function Hero() {
  const mountRef = useRef(null);
  const targetRef = useRef({ x: 0, y: 0 });

  useEffect(() => {
    const mount = mountRef.current;
    if (!mount || !window.THREE) return;
    const THREE = window.THREE;

    const w = () => mount.clientWidth;
    const h = () => mount.clientHeight;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1C1D21, 0.05);

    const camera = new THREE.PerspectiveCamera(55, w() / h(), 0.1, 100);
    camera.position.set(0, 0, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w(), h());
    renderer.setClearColor(0x1C1D21, 1);
    mount.appendChild(renderer.domElement);

    /* ---- Procedural point cloud ----
       ~5000 particles in a soft toroidal/spherical distribution.
       Layered as 3 PointClouds with different sizes/opacities for a fake bloom. */
    const NUM = 5000;
    const positions = new Float32Array(NUM * 3);
    const seeds = new Float32Array(NUM);
    for (let i = 0; i < NUM; i++) {
      // Mix of two distributions for visual depth
      const t = Math.random();
      let x, y, z;
      if (t < 0.65) {
        // toroidal sweep
        const u = Math.random() * Math.PI * 2;
        const v = Math.random() * Math.PI * 2;
        const R = 4.2 + (Math.random() - 0.5) * 0.6;
        const r = 1.8 + (Math.random() - 0.5) * 0.9;
        x = (R + r * Math.cos(v)) * Math.cos(u);
        y = (R + r * Math.cos(v)) * Math.sin(u) * 0.5;
        z = r * Math.sin(v);
      } else {
        // spherical halo
        const u = Math.random();
        const phi = Math.acos(2 * Math.random() - 1);
        const theta = Math.random() * Math.PI * 2;
        const radius = 3 + Math.pow(u, 0.5) * 4;
        x = radius * Math.sin(phi) * Math.cos(theta);
        y = radius * Math.sin(phi) * Math.sin(theta) * 0.6;
        z = radius * Math.cos(phi);
      }
      positions[i*3+0] = x;
      positions[i*3+1] = y;
      positions[i*3+2] = z;
      seeds[i] = Math.random();
    }

    const baseGeom = new THREE.BufferGeometry();
    baseGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    /* Mid-tone point cloud: #7DD3FC particles, primary layer @ 0.85 opacity + a larger 1.5x layer @ 0.3 for in-cloud depth */
    const makeLayer = (size, opacity) => {
      const mat = new THREE.PointsMaterial({
        color: 0x7DD3FC,
        size,
        sizeAttenuation: true,
        transparent: true,
        opacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      return new THREE.Points(baseGeom, mat);
    };

    const layerCore  = makeLayer(0.024, 0.85);   // primary
    const layerDepth = makeLayer(0.036, 0.30);   // ~1.5x size, in-cloud depth
    const layerGlow  = makeLayer(0.10,  0.08);   // soft halo

    const group = new THREE.Group();
    group.add(layerCore, layerDepth, layerGlow);
    scene.add(group);

    // Subtle accent star scatter (white dim)
    const starsPos = new Float32Array(800 * 3);
    for (let i=0;i<800;i++){
      starsPos[i*3+0] = (Math.random()-0.5)*30;
      starsPos[i*3+1] = (Math.random()-0.5)*18;
      starsPos[i*3+2] = -8 - Math.random()*10;
    }
    const starsGeom = new THREE.BufferGeometry();
    starsGeom.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
    /* Subtle light dot scatter — ambient stars for depth */
    const starsMat = new THREE.PointsMaterial({
      color: 0xEDEDEF, size: 0.016, transparent: true, opacity: 0.25,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    scene.add(new THREE.Points(starsGeom, starsMat));

    let raf = 0;
    const start = performance.now();

    const onMove = (e) => {
      const rect = mount.getBoundingClientRect();
      const nx = (e.clientX - rect.left) / rect.width - 0.5;
      const ny = (e.clientY - rect.top) / rect.height - 0.5;
      targetRef.current = { x: nx, y: ny };
    };
    window.addEventListener('mousemove', onMove);

    const onResize = () => {
      camera.aspect = w() / h();
      camera.updateProjectionMatrix();
      renderer.setSize(w(), h());
    };
    window.addEventListener('resize', onResize);

    let camX = 0, camY = 0;
    const baseRadius = 9;

    const tick = () => {
      const t = (performance.now() - start) / 1000;

      // Slow rotation + drift
      group.rotation.y = t * 0.06;
      group.rotation.x = Math.sin(t * 0.12) * 0.08;

      // Gentle "breathing" on scales for fake bloom
      const breath = 1 + Math.sin(t * 0.6) * 0.015;
      group.scale.set(breath, breath, breath);

      // Mouse parallax — ~5 deg per axis
      const tx = targetRef.current.x;
      const ty = targetRef.current.y;
      camX += (tx * 0.087 - camX) * 0.04;     // ~5° in radians
      camY += (-ty * 0.087 - camY) * 0.04;
      camera.position.x = Math.sin(camX) * baseRadius * 0.15;
      camera.position.y = Math.sin(camY) * baseRadius * 0.15;
      camera.position.z = baseRadius;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
      raf = requestAnimationFrame(tick);
    };
    tick();

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('resize', onResize);
      renderer.dispose();
      baseGeom.dispose();
      starsGeom.dispose();
      if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
    };
  }, []);

  return (
    <section data-screen-label="01 Hero" className="relative w-full" style={{ minHeight: "100vh" }}>
      <div ref={mountRef} className="hero-canvas" />

/* ============================================================
   SCROLL PROGRESS
   ============================================================ */
function ScrollProgress() {
  const ref = useRef(null);
  useEffect(() => {
    const onScroll = () => {
      const el = ref.current;
      if (!el) return;
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      const pct = max > 0 ? (h.scrollTop / max) * 100 : 0;
      el.style.width = pct + "%";
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
    };
  }, []);
  return <div ref={ref} className="scroll-progress" />;
}

   APP
   ============================================================ */
function App() {
  return (
    <div className="min-h-screen text-[var(--text)] bg-[var(--bg)]">
      <ScrollProgress />
      <Hero />
      <Marquee />
      <About />
      <Projects />
      <Experience />
      <Capabilities />
      <Contact />
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
